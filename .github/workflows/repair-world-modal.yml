name: repair-world-modal
on:
  push:
    branches: [world-integration-work]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix(world): repair activity modal syntax') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed Array.from expression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/learning/components/WorldActivityExperienceModal.tsx')
          s = p.read_text()
          old = 'items:Array.from({length:9},(_,cell)=>cell===((i*3+2)%9)?correct:`path-${cell+1}`,correct,kind:\'grid\''
          new = 'items:Array.from({length:9},(_,cell)=>cell===((i*3+2)%9)?correct:`path-${cell+1}`),correct,kind:\'grid\''
          if old not in s:
              print('No repair needed')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/learning/components/WorldActivityExperienceModal.tsx
          git commit -m 'fix(world): repair activity modal syntax'
          git push
