name: verify-world-modal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/features/learning/components/WorldActivityExperienceModal.tsx"
      - ".github/workflows/repair-world-modal.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify activity modal syntax repair is present
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/learning/components/WorldActivityExperienceModal.tsx')
          s = p.read_text()
          malformed = "items:Array.from({length:9},(_,cell)=>cell===((i*3+2)%9)?correct:`path-${cell+1}`,correct,kind:'grid'"
          if malformed in s:
              raise SystemExit('Malformed Array.from expression is still present')
          print('World activity modal syntax repair verified')
          PY