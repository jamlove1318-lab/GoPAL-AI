name: Cassidy Blender Production

run-name: Cassidy production • ${{ inputs.mode || 'build' }} • ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Production operation
        required: true
        default: build
        type: choice
        options:
          - build
          - validate
          - export
      clean:
        description: Reset the Blender production scene before building
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cassidy-blender-production
  cancel-in-progress: false

jobs:
  cassidy:
    name: Cassidy • Blender production
    runs-on: [self-hosted, linux, ARM64, cassidy-blender]
    timeout-minutes: 120

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Verify runner and Blender
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          echo "Architecture: $(uname -m)"
          command -v blender
          blender --background --factory-startup --python-expr 'import bpy; print("BLENDER_VERSION=" + bpy.app.version_string); print("BLENDER_PLATFORM=" + str(bpy.app.build_platform))'
          python3 --version

      - name: Prepare output directory
        shell: bash
        run: mkdir -p artifacts/cassidy

      - name: Run Cassidy production pipeline
        if: inputs.mode == 'build'
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/blender
        run: |
          set -euo pipefail
          if [ "${{ inputs.clean }}" = "true" ]; then
            blender --background --factory-startup --python tools/blender/characters/cassidy_ci_entry.py 2>&1 | tee artifacts/cassidy/blender.log
          else
            blender --background --python tools/blender/characters/cassidy_ci_entry.py 2>&1 | tee artifacts/cassidy/blender.log
          fi

      - name: Validate current production scene
        if: inputs.mode == 'validate'
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/blender
        run: |
          set -euo pipefail
          blender --background --python tools/blender/characters/cassidy_ci_entry.py 2>&1 | tee artifacts/cassidy/blender.log

      - name: Export current production scene
        if: inputs.mode == 'export'
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/blender
        run: |
          set -euo pipefail
          blender --background --python tools/blender/characters/cassidy_ci_entry.py 2>&1 | tee artifacts/cassidy/blender.log

      - name: Publish Cassidy build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassidy-production-${{ github.run_id }}
          path: artifacts/cassidy/
          if-no-files-found: warn
          retention-days: 14
