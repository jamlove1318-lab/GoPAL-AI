name: World Final Validation

# Expensive full validation is a deliberate gate, not a per-commit main build.
# Direct main development stays cheap; pull requests and manual dispatch validate.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "App.tsx"
      - "index.ts"
      - "assets/**"
      - "scripts/**"
      - "tools/blender/**"
      - "package.json"
      - "tsconfig.json"
      - "app.json"
      - "babel.config.js"
      - "metro.config.js"
      - "eas.json"
      - ".github/workflows/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: External world asset policy validation
        run: npm run validate:world-assets
      - name: Mini-game asset policy validation
        run: npm run validate:mini-game-assets
      - name: World visual representation validation
        run: npm run validate:world-visuals
      - name: World runtime promotion gate
        run: npm run validate:world-runtime-promotion
      - name: End-to-end world asset pipeline report
        run: npm run report:world-asset-pipeline
      - name: Independent glTF/GLB validation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t glbs < <(find assets artifacts -type f -name '*.glb' -not -path './node_modules/*' 2>/dev/null | sort)
          if [ "${#glbs[@]}" -eq 0 ]; then
            echo "[INFO] No generated/runtime GLB files are present yet; gate remains fail-closed for promotion."
          else
            npm run validate:world-glb -- "${glbs[@]}"
          fi
      - name: TypeScript validation
        run: npm run typecheck
      - name: Expo dependency alignment check
        run: npx expo install --check
      - name: Expo configuration validation
        run: npx expo config --type public > /tmp/gopal-expo-config.json
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Web bundle validation
        run: npx expo export --platform web --output-dir /tmp/gopal-web-export
      - name: Android prebuild validation
        run: npx expo prebuild --platform android --no-install
      - name: Repository test-file inventory
        shell: bash
        run: |
          set -euo pipefail
          count=$(find . -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) -not -path './node_modules/*' | wc -l)
          echo "Discovered $count repository test/spec files."
          find . -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) -not -path './node_modules/*' | sort
      - name: Dependency security audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee /tmp/npm-audit.txt
      - name: World integrity smoke check
        run: node -e "console.log('World final validation reached runtime smoke-check stage')"
      - name: Upload world pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gopal-world-pipeline-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/external-world/**
            /tmp/gopal-expo-config.json
            /tmp/npm-audit.txt
            /tmp/gopal-web-export/**
