name: Build Release APK

# Release APK builds are intentionally manual during active development.
# Use workflow_dispatch when a coherent batch is ready for device testing.
# This prevents every development commit on main from consuming Android build minutes.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          ndk: "27.1.12297006"
          build-tools: "36.0.0"
      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "platforms;android-36"
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Install Expo CLI + align native deps to SDK
        run: |
          npm install --save-dev expo
          npx expo install --npm react react-native react-native-reanimated react-native-safe-area-context react-native-svg react-native-worklets @react-native-async-storage/async-storage expo-status-bar expo-updates
          npm install --legacy-peer-deps
      - name: Clean JS export (pre-bundle)
        run: npx expo export -p android --output-dir dist-export --non-interactive
      - name: Expo prebuild (Android)
        run: npx expo prebuild -p android --clean --no-install
      - name: Install native dependencies (post-prebuild)
        run: npm install --legacy-peer-deps
      - name: Set up Gradle signing (persistent keystore)
        run: |
          KEYSTORE_BASE64="${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          echo "ANDROID_KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64}"
          KEYSTORE_B64=$(echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | tr -- '-_' '+/')
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is EMPTY — generating ephemeral keystore (APK will NOT be upgradable)."
            STORE_PASS=$(openssl rand -hex 16); KEY_ALIAS=release; KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v -keystore android/app/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$STORE_PASS" -dname "CN=GoPAL, OU=GoPAL, O=GoPAL, C=US"
          elif [ "$KEYSTORE_BASE64" = "***" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is the placeholder — generating ephemeral keystore."
            STORE_PASS=$(openssl rand -hex 16); KEY_ALIAS=release; KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v -keystore android/app/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$STORE_PASS" -dname "CN=GoPAL, OU=GoPAL, O=GoPAL, C=US"
          elif echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore 2>/dev/null && [ -s /tmp/release.keystore ]; then
            mv /tmp/release.keystore android/app/release.keystore
            STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"; KEY_ALIAS="${{ secrets.KEY_ALIAS }}"; KEY_PASS="${{ secrets.KEY_PASSWORD }}"
            echo "Using persistent keystore."
          else
            echo "::warning::Invalid keystore base64 — generating ephemeral keystore."
            STORE_PASS=$(openssl rand -hex 16); KEY_ALIAS=release; KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v -keystore android/app/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$STORE_PASS" -dname "CN=GoPAL, OU=GoPAL, O=GoPAL, C=US"
          fi
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          sed -i '/^expo.inlineModules.watchedDirectories=/d' android/gradle.properties
          printf '\n' >> android/gradle.properties
          {
            echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$STORE_PASS"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASS"
            echo "expo.inlineModules.watchedDirectories=[]"
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
            echo "reactNativeArchitectures=arm64-v8a"
          } >> android/gradle.properties
      - name: Build signed release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          test -f "$APK"
          echo "Release APK: $(ls -lh "$APK")"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gopal-ai-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
