name: World Integration Typecheck

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "yarn.lock"
      - ".github/workflows/world-typecheck.yml"
  push:
    branches: [main, world-integration-work]
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "yarn.lock"
      - ".github/workflows/world-typecheck.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: TypeScript validation
        run: yarn typecheck
