name: World Integration Typecheck

# Keep direct main development cheap. Typecheck runs for PRs or explicit dispatch.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/world-typecheck.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: TypeScript validation
        run: npm run typecheck
